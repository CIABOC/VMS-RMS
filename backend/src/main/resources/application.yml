# All environment-specific values come from environment variables (see /.env.example).
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: ciaboc-rvm
  # Local credentials live in the project-root .env file (git-ignored), so no password is kept in code.
  # Real environment variables still take priority over .env.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ciaboc_rvm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  # dev = SSO not yet merged; staff sign in by e-mail on the sign-in page (no passwords).
  # sso = the dev sign-in endpoint is disabled; only Single Sign-On is accepted.
  auth-mode: ${APP_AUTH_MODE:dev}
  sso-login-url: ${APP_SSO_LOGIN_URL:}
  # Created on first start only when the staff table is empty, so somebody can open screen 14.
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:System Administrator}
  time-zone: ${APP_TIME_ZONE:Asia/Colombo}
  # Secret for signing visitor NFC cards (at least 32 random characters). Keep it stable:
  # changing it makes every card already handed out fail the check. Required when auth-mode=sso.
  card-secret: ${APP_CARD_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
