# Local / test stack. Values come from .env (copy .env.example to .env first).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_AUTH_MODE: ${APP_AUTH_MODE}
      APP_SSO_LOGIN_URL: ${APP_SSO_LOGIN_URL}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME}
      APP_TIME_ZONE: ${APP_TIME_ZONE}
      APP_CARD_SECRET: ${APP_CARD_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
    profiles: ["full"]

  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"
    profiles: ["full"]

volumes:
  pgdata:
